version: '3.8'

services:
  pelican-postgres:
    image: postgres:15
    container_name: pelican-postgres
    environment:
      POSTGRES_DB: pelicanwork
      POSTGRES_USER: pelican
      POSTGRES_PASSWORD: pelicanpw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelican -d pelicanwork"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: