spring.application.name=pelicanwork-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/pelicanwork
spring.datasource.username=pelican
spring.datasource.password=pelicanpw
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=8080